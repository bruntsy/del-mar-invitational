name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - rewrite

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run legacy event regression tests
        run: node scripts/event-format-tests.js

      - name: Run test suite
        run: npm run test:run

      - name: Type-check and build
        run: npm run build
